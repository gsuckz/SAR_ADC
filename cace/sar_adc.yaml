#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           sar_adc
description:    12 Bits @ 1MSample/s SAR ADC - Differential Monotonic
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Jesus Avila
  company:          Universidad Nacional de Tucuman - FACET
  creation_date:    Apr 27, 2025
  license:          Apache 2.0
paths:
  root:             ..
  schematic:        xschem
  layout:           gds
  netlist:          netlist
  documentation:    docs

pins:
  VDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.7
    Vmax: 1.9
  d0:
    description: Bit Number 0
    type: digital
    direction: in
  d1:
    description: Bit Number 1
    type: digital
    direction: in
  d2:
    description: Bit Number 2
    type: digital
    direction: in
  d3:
    description: Bit Number 3
    type: digital
    direction: in
  d4:
    description: Bit Number 4
    type: digital
    direction: in
  d5:
    description: Bit Number 5
    type: digital
    direction: in
  d6:
    description: Bit Number 6
    type: digital
    direction: in
  d7:
    description: Bit Number 7
    type: digital
    direction: in
  d8:
    description: Bit Number 8
    type: digital
    direction: in
  d9:
    description: Bit Number 9
    type: digital
    direction: in
  d10:
    description: Bit Number 10
    type: digital
    direction: in
  d11:
    description: Bit Number 11
    type: digital
    direction: in
  xd:
    description: Top Plate CDAC
    type: signal
    direction: inout 

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: Vdd
    unit: V
    typical: 1.8
  corner:
    description: Process corner
    display: Corner
    typical: tt
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    typical: 27

parameters:
  CDAC_prueba:
    display: Valores rampa CDAC
    spec:
      CDAC_prueba:
        display: prueba CDAC
        description: XXX
        unit: V/V
        minimum:
          value: 50
        typical:
          value: any
        maximum:
          value: any
    tool:
      ngspice:
        template: tb_cdac_tran.sch
        format: ascii
        suffix: .data
        variables: [a0, ugf, pm]
    plot:
      gain_vs_temp:
        type: xyplot
        xaxis: temperature
        yaxis: a0
    conditions:
      corner:
        enumerate: [ss, tt, ff]
      vdd:
        minimum: 1.7
        typical: 1.8
        maximum: 1.9
      temperature:
        minimum: -40
        typical: 27
        maximum: 130

